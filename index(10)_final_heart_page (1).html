<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Story</title>
  <style>
    :root {
      --cream: #fff7ef;
      --blush: #f8d9dd;
      --rose: #d98a98;
      --petal: #efbac4;
      --lavender: #d9c7e8;
      --ink: #46363c;
      --muted: #7d656d;
      --paper: #fffaf5;
      --shadow: rgba(82, 53, 61, 0.18);
      --glow: rgba(255, 216, 225, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      opacity: 0;
      animation: sceneFade 1200ms ease forwards;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.72) 0 12rem, transparent 27rem),
        linear-gradient(145deg, #fffaf2 0%, #fae5e7 52%, #f7d7df 100%);
    }

    .scene::before {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      background:
        linear-gradient(to bottom, rgba(255, 255, 255, 0.24), transparent 34%),
        radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.52), transparent 58%);
      pointer-events: none;
    }

    .particles,
    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 0 18px var(--glow);
      opacity: 0;
      animation: particleRise var(--duration) ease-in-out var(--delay) infinite;
    }

    .opening {
      position: relative;
      display: grid;
      width: min(92vw, 680px);
      min-height: min(760px, 96svh);
      align-content: center;
      justify-items: center;
      padding: clamp(20px, 6vw, 56px) 18px;
    }

    .copy {
      min-height: 150px;
      text-align: center;
      text-wrap: balance;
    }

    .headline {
      margin: 0;
      color: #3d3035;
      font-size: clamp(2.4rem, 9vw, 5.35rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 0.98;
    }

    .headline .char,
    .subtitle .word,
    .name .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(0.5em);
      filter: blur(8px);
      animation: writeIn 650ms cubic-bezier(.2, .75, .14, 1) forwards;
      animation-delay: var(--delay);
    }

    .subtitle {
      width: min(100%, 560px);
      margin: 18px auto 0;
      color: var(--muted);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(1rem, 3vw, 1.22rem);
      font-weight: 400;
      line-height: 1.65;
    }

    .subtitle .word {
      margin-right: 0.25em;
    }

    .name {
      min-height: 52px;
      margin: 12px 0 0;
      color: #b86676;
      font-size: clamp(1.7rem, 5.5vw, 3rem);
      font-weight: 400;
      line-height: 1.1;
    }

    .photo-stage {
      position: relative;
      width: min(62vw, 320px);
      margin-top: clamp(10px, 2vh, 22px);
      transform: translateY(64px) scale(0.965);
      opacity: 0;
      animation: photoArrive 1100ms cubic-bezier(.18, .8, .22, 1.04) 1750ms forwards;
    }

    .photo-frame {
      position: relative;
      aspect-ratio: 4 / 5;
      padding: 12px 12px 54px;
      background: var(--paper);
      border-radius: 3px;
      box-shadow:
        0 26px 48px var(--shadow),
        0 8px 18px rgba(118, 76, 87, 0.09);
      transform: rotate(-1.7deg);
    }

    .photo {
      position: relative;
      display: grid;
      width: 100%;
      height: 100%;
      overflow: hidden;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(255,255,255,.46), transparent 34%),
        linear-gradient(160deg, #eeb6c2, #f9dfdf 50%, #d9c7e8);
    }

    .photo img {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo.has-image img {
      display: block;
    }

    .photo.has-image .photo-placeholder {
      display: none;
    }

    .photo-placeholder {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 20px;
      color: rgba(70, 54, 60, 0.68);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(0.85rem, 2.6vw, 1rem);
      line-height: 1.45;
      text-align: center;
    }

    .caption {
      position: absolute;
      right: 16px;
      bottom: 17px;
      left: 16px;
      color: rgba(70, 54, 60, 0.58);
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 0.82rem;
      text-align: center;
    }

    .hat {
      position: absolute;
      z-index: 3;
      top: -110px;
      left: 50%;
      width: clamp(58px, 15vw, 78px);
      height: clamp(66px, 17vw, 90px);
      transform: translateX(-50%) rotate(-8deg);
      opacity: 0;
      animation: hatDrop 1200ms cubic-bezier(.32, .86, .28, 1.08) 6100ms forwards;
      transform-origin: 50% 85%;
    }

    .hat-cone {
      position: absolute;
      inset: 0 10% 18%;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background:
        repeating-linear-gradient(115deg, transparent 0 12px, rgba(255,255,255,.42) 12px 21px),
        linear-gradient(160deg, #f09daf, #efc3a4);
      box-shadow: 0 10px 18px rgba(95, 62, 75, 0.12);
    }

    .hat-brim {
      position: absolute;
      right: 3%;
      bottom: 12%;
      left: 3%;
      height: 18%;
      border-radius: 999px;
      background: #fff7ef;
      box-shadow: inset 0 -4px 0 rgba(217, 138, 152, .22);
    }

    .hat-pom {
      position: absolute;
      top: -5%;
      left: 50%;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 999px;
      background: #fffaf5;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(255,255,255,.28);
    }

    .sparkle {
      position: absolute;
      width: 9px;
      height: 9px;
      opacity: 0;
      color: #fff7c6;
      transform: rotate(45deg) scale(0.2);
      animation: sparklePop 900ms ease forwards;
      animation-delay: var(--delay);
    }

    .sparkle::before,
    .sparkle::after {
      position: absolute;
      inset: 0;
      content: "";
      border-radius: 2px;
      background: currentColor;
      box-shadow: 0 0 13px rgba(255, 226, 128, 0.82);
    }

    .sparkle::after {
      transform: rotate(90deg);
    }

    .petal {
      position: absolute;
      width: var(--w);
      height: var(--h);
      left: var(--x);
      top: -30px;
      border-radius: 90% 10% 90% 10%;
      background: var(--c);
      opacity: 0;
      animation: petalFall var(--duration) ease-in var(--delay) forwards;
    }

    .begin {
      position: relative;
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: clamp(22px, 4vh, 34px);
      padding: 0 22px;
      border: 1px solid rgba(184, 102, 118, 0.28);
      border-radius: 999px;
      background: rgba(255, 250, 245, 0.62);
      box-shadow: 0 14px 32px rgba(149, 93, 105, 0.12);
      color: #7d4652;
      cursor: pointer;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(0.98rem, 3vw, 1.06rem);
      opacity: 0;
      transform: translateY(14px);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      animation: buttonIn 700ms ease 7700ms forwards;
    }

    .begin:hover {
      background: rgba(255, 250, 245, 0.86);
      box-shadow: 0 16px 34px rgba(149, 93, 105, 0.18);
      transform: translateY(-2px);
    }

    .begin:focus-visible {
      outline: 3px solid rgba(217, 138, 152, 0.46);
      outline-offset: 4px;
    }

    body.scene-two .opening {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-26px) scale(0.98);
      transition: opacity 850ms ease, transform 850ms ease;
    }

    body.scene-two .particles {
      opacity: 0.42;
    }

    .letter-room {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      overflow: hidden;
      place-items: center;
      padding: clamp(18px, 4vw, 44px);
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.74), transparent 26rem),
        radial-gradient(circle at 18% 76%, rgba(255, 250, 245, 0.48), transparent 18rem),
        radial-gradient(circle at 84% 20%, rgba(217, 199, 232, 0.22), transparent 16rem),
        linear-gradient(180deg, rgba(244, 210, 216, 0.96), rgba(255, 247, 239, 0.98) 62%, rgba(239, 186, 196, 0.72));
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.025);
      transition: opacity 900ms ease, transform 900ms ease;
    }

    body.scene-two .letter-room {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .room-glow {
      position: absolute;
      inset: auto 8% 0;
      height: 30%;
      background: radial-gradient(ellipse, rgba(255,255,255,.62), transparent 68%);
      pointer-events: none;
    }

    .window {
      display: none;
    }

    .room-title {
      position: absolute;
      top: clamp(20px, 5vh, 46px);
      left: 50%;
      width: min(88vw, 520px);
      margin: 0;
      color: rgba(70, 54, 60, 0.72);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 4vw, 2.1rem);
      font-weight: 400;
      line-height: 1.2;
      transform: translateX(-50%);
    }

    .desk {
      display: none;
    }

    .envelope-area {
      position: relative;
      z-index: 2;
      display: grid;
      width: min(86vw, 560px);
      min-height: min(76svh, 620px);
      align-content: center;
      justify-items: center;
      padding-top: clamp(38px, 8vh, 92px);
      transform: translateY(34px) scale(0.92);
      transition: transform 800ms cubic-bezier(.2, .8, .2, 1);
    }

    .envelope-area.is-close {
      transform: translateY(-10px) scale(1);
    }

    .envelope-hint {
      min-height: 26px;
      margin: 0 0 22px;
      color: rgba(70, 54, 60, 0.66);
      font-size: clamp(0.92rem, 2.7vw, 1.02rem);
      line-height: 1.4;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 600ms ease, transform 600ms ease;
    }

    body.scene-two .envelope-hint {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 900ms;
    }

    .envelope-area.has-open-letter .envelope-hint {
      opacity: 0;
      transform: translateY(-8px);
      transition-delay: 0ms;
    }

    .envelope {
      position: relative;
      width: min(78vw, 360px);
      aspect-ratio: 1.45 / 1;
      border: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 28px 38px rgba(82, 53, 61, 0.18));
      transform: rotate(-1deg);
      transition: transform 500ms ease, filter 500ms ease;
    }

    .envelope.is-open {
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px) scale(0.9) rotate(-1deg);
      transition: opacity 520ms ease, transform 520ms ease, filter 520ms ease;
    }

    .envelope:hover {
      transform: translateY(-4px) rotate(-1deg);
      filter: drop-shadow(0 32px 42px rgba(82, 53, 61, 0.22));
    }

    .envelope:focus-visible {
      outline: 3px solid rgba(217, 138, 152, 0.52);
      outline-offset: 8px;
      border-radius: 5px;
    }

    .env-back,
    .env-front,
    .env-flap,
    .env-left,
    .env-right {
      position: absolute;
      inset: 0;
      border-radius: 5px;
    }

    .env-back {
      background: linear-gradient(145deg, #fff7ed, #f8dce0);
    }

    .env-flap {
      z-index: 3;
      clip-path: polygon(0 0, 100% 0, 50% 58%);
      background: linear-gradient(160deg, #ffe9df, #f4bfc8);
      transform-origin: 50% 0;
      transition: transform 950ms cubic-bezier(.2, .74, .1, 1), z-index 1ms linear 550ms;
    }

    .envelope.is-open .env-flap {
      z-index: 0;
      transform: rotateX(178deg);
    }

    .env-front {
      z-index: 4;
      clip-path: polygon(0 25%, 50% 62%, 100% 25%, 100% 100%, 0 100%);
      background: linear-gradient(160deg, #fff5ee, #f7cfd5);
    }

    .env-left {
      z-index: 5;
      clip-path: polygon(0 0, 51% 61%, 0 100%);
      background: linear-gradient(120deg, rgba(255,250,245,.9), rgba(239,186,196,.66));
    }

    .env-right {
      z-index: 5;
      clip-path: polygon(100% 0, 49% 61%, 100% 100%);
      background: linear-gradient(240deg, rgba(255,250,245,.82), rgba(239,186,196,.62));
    }

    .env-address {
      position: absolute;
      z-index: 7;
      inset: 36% 10% auto;
      display: grid;
      gap: 7px;
      color: rgba(70, 54, 60, 0.68);
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      line-height: 1.25;
      pointer-events: none;
    }

    .env-address strong {
      color: #9d5868;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.1rem, 4vw, 1.62rem);
      font-weight: 400;
    }

    .ribbon-line {
      position: absolute;
      z-index: 8;
      top: 50%;
      right: 0;
      left: 0;
      height: 16px;
      background: linear-gradient(90deg, #c77d8d, #e5a7b2, #c77d8d);
      box-shadow: inset 0 4px 0 rgba(255,255,255,.18);
      transform: translateY(-50%);
      transition: opacity 500ms ease, transform 500ms ease;
    }

    .seal {
      position: absolute;
      z-index: 9;
      top: 50%;
      left: 50%;
      display: grid;
      width: clamp(58px, 16vw, 74px);
      aspect-ratio: 1;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background:
        radial-gradient(circle at 36% 30%, rgba(255,255,255,.24), transparent 24%),
        linear-gradient(145deg, #bf6675, #9a4355);
      color: #fff7ef;
      cursor: grab;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      box-shadow:
        inset 0 -7px 0 rgba(78, 40, 48, 0.16),
        0 10px 18px rgba(82, 53, 61, 0.2);
      transform: translate(-50%, -50%);
      touch-action: none;
      transition: box-shadow 180ms ease, opacity 500ms ease, transform 500ms ease;
    }

    .seal:active {
      cursor: grabbing;
      box-shadow:
        inset 0 -7px 0 rgba(78, 40, 48, 0.16),
        0 14px 20px rgba(82, 53, 61, 0.24);
    }

    .seal:focus-visible {
      outline: 3px solid rgba(217, 138, 152, 0.6);
      outline-offset: 4px;
    }

    .envelope.is-open .ribbon-line,
    .envelope.is-open .seal {
      opacity: 0;
      pointer-events: none;
    }

    .envelope.is-open .ribbon-line {
      transform: translateY(-50%) scaleX(0.38);
    }

    .letter-paper {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 50%;
      display: flex;
      width: min(92vw, 640px);
      min-height: min(72svh, 650px);
      max-height: calc(100svh - 74px);
      flex-direction: column;
      overflow: auto;
      padding: clamp(22px, 5vw, 34px);
      border-radius: 4px;
      background:
        linear-gradient(90deg, rgba(217,138,152,.16), transparent 9%, transparent 91%, rgba(217,138,152,.16)),
        linear-gradient(180deg, #fffaf5, #fff4ec);
      box-shadow: 0 28px 56px rgba(82, 53, 61, 0.18);
      color: #4a3940;
      text-align: left;
      opacity: 0;
      transform: translate(-50%, 24%) scaleY(0.24);
      transform-origin: 50% 0;
      transition: opacity 700ms ease 450ms, transform 1200ms cubic-bezier(.18, .84, .2, 1) 450ms;
    }

    .letter-paper.is-visible {
      z-index: 12;
      opacity: 1;
      transform: translate(-50%, -50%) scaleY(1);
    }

    .letter-lines {
      display: grid;
      gap: 14px;
      margin: 0;
      flex: 1;
      align-content: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 3vw, 1.22rem);
      line-height: 1.65;
    }

    .letter-line {
      min-height: 1.2em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .letter-line.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .more {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      align-self: center;
      justify-content: center;
      margin-top: clamp(26px, 6vh, 54px);
      padding: 0 18px;
      border: 1px solid rgba(184, 102, 118, 0.24);
      border-radius: 999px;
      background: rgba(255, 247, 239, 0.76);
      color: #854b58;
      cursor: pointer;
      font-size: 0.95rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 600ms ease, transform 600ms ease, background 180ms ease;
    }

    .more.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .more:hover {
      background: rgba(255, 247, 239, 0.96);
      transform: translateY(-2px);
    }

    .polaroids {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
    }

    .polaroid {
      position: absolute;
      display: grid;
      width: clamp(92px, 17vw, 138px);
      aspect-ratio: 0.82;
      padding: 8px 8px 28px;
      border: 0;
      border-radius: 3px;
      background: #fffaf5;
      box-shadow: 0 18px 36px rgba(82, 53, 61, 0.16);
      color: rgba(70, 54, 60, 0.66);
      cursor: grab;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 0.72rem;
      opacity: 0;
      pointer-events: auto;
      transform: translateY(16px) rotate(var(--rot));
      transition: opacity 700ms ease, transform 700ms ease;
      touch-action: none;
    }

    .polaroid.is-visible {
      opacity: 1;
      transform: translateY(0) rotate(var(--rot));
    }

    .polaroid.is-dragging {
      cursor: grabbing;
      transition: none;
      z-index: 14;
    }

    .polaroid-picture {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      background:
        radial-gradient(circle at 36% 24%, rgba(255,255,255,.64), transparent 24%),
        linear-gradient(145deg, var(--a), var(--b));
      color: rgba(70, 54, 60, 0.4);
      font-size: 1.8rem;
    }

    .polaroid-caption {
      position: absolute;
      right: 8px;
      bottom: 8px;
      left: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.scene-three .letter-room {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    .music-room {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: grid;
      overflow: hidden;
      place-items: center;
      padding: clamp(18px, 4vw, 44px);
      background:
        radial-gradient(circle at 50% 42%, rgba(244, 188, 199, 0.22), transparent 24rem),
        radial-gradient(circle at 18% 18%, rgba(217, 199, 232, 0.2), transparent 18rem),
        linear-gradient(180deg, #211b28 0%, #342535 58%, #513140 100%);
      color: #fff7ef;
      font-family: "Trebuchet MS", Arial, sans-serif;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.025);
      transition: opacity 950ms ease, transform 950ms ease;
    }

    body.scene-three .music-room {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .stars,
    .music-reaction,
    .music-photos {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 999px;
      background: rgba(255, 250, 245, 0.86);
      box-shadow: 0 0 16px rgba(248, 217, 221, 0.7);
      opacity: var(--opacity);
      animation: starPulse var(--duration) ease-in-out var(--delay) infinite;
    }

    .music-copy {
      position: absolute;
      top: clamp(24px, 6vh, 58px);
      left: 50%;
      width: min(88vw, 620px);
      text-align: center;
      text-wrap: balance;
      transform: translateX(-50%);
    }

    .music-copy h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.65rem, 5.5vw, 3.35rem);
      font-weight: 400;
      line-height: 1.05;
    }

    .music-copy p {
      margin: 14px 0 0;
      color: rgba(255, 247, 239, 0.72);
      font-size: clamp(0.96rem, 3vw, 1.12rem);
      line-height: 1.55;
    }

    .music-stage {
      position: relative;
      z-index: 2;
      display: grid;
      width: min(92vw, 760px);
      min-height: min(70svh, 620px);
      align-content: center;
      justify-items: center;
      padding-top: clamp(72px, 12vh, 116px);
    }

    .turntable-wrap {
      position: relative;
      display: grid;
      width: min(82vw, 410px);
      aspect-ratio: 1.28;
      place-items: center;
      opacity: 0;
      transform: translateY(36px) scale(0.94);
      animation: playerIn 900ms cubic-bezier(.2,.8,.18,1) 520ms forwards;
    }

    .turntable {
      position: absolute;
      inset: 10% 2% 0;
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.12), transparent 35%),
        linear-gradient(145deg, #574052, #2d2433);
      box-shadow: 0 34px 62px rgba(0, 0, 0, 0.32);
    }

    .record {
      position: absolute;
      left: 5%;
      top: 1%;
      width: 69%;
      aspect-ratio: 1;
      border-radius: 999px;
      background:
        radial-gradient(circle, #efd2c9 0 9%, #2c2430 10% 16%, transparent 17%),
        repeating-radial-gradient(circle, #17141b 0 5px, #211b26 6px 8px);
      box-shadow:
        inset 0 0 0 13px rgba(255,255,255,.025),
        0 24px 42px rgba(0,0,0,.28);
      transform: rotate(0deg);
    }

    body.scene-three .record {
      animation: recordSpin 5200ms linear 1900ms infinite;
    }

    .album-art,
    .music-art {
      background:
        radial-gradient(circle at 34% 27%, rgba(255,255,255,.72), transparent 24%),
        linear-gradient(145deg, #f1a8b6, #e9c7a7 54%, #b6a0d0);
    }

    .album-art {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30%;
      aspect-ratio: 1;
      border-radius: 999px;
      box-shadow:
        inset 0 0 0 4px rgba(255, 247, 239, 0.22),
        0 8px 18px rgba(0,0,0,.22);
      transform: translate(-50%, -50%);
    }

    .needle {
      position: absolute;
      right: 14%;
      top: 14%;
      width: 34%;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e9d8d1, #9f8790);
      box-shadow: 0 8px 14px rgba(0,0,0,.26);
      transform: rotate(-28deg);
      transform-origin: 90% 50%;
    }

    body.scene-three .needle {
      animation: needleDrop 1350ms cubic-bezier(.2,.8,.2,1) 1100ms forwards;
    }

    .needle::before {
      position: absolute;
      right: -13px;
      top: 50%;
      width: 34px;
      aspect-ratio: 1;
      content: "";
      border-radius: 999px;
      background: #f2ded8;
      transform: translateY(-50%);
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.14);
    }

    .needle::after {
      position: absolute;
      left: -8px;
      top: 50%;
      width: 23px;
      height: 15px;
      content: "";
      border-radius: 5px 2px 2px 5px;
      background: #cf91a0;
      transform: translateY(-50%);

    .music-card {
      position: relative;
      z-index: 3;
      display: grid;
      width: min(88vw, 430px);
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: center;
      margin-top: -8px;
      padding: 13px;
      border: 1px solid rgba(255, 247, 239, 0.14);
      border-radius: 8px;
      background: rgba(255, 247, 239, 0.09);
      box-shadow: 0 20px 46px rgba(0,0,0,.24);
      opacity: 0;
      transform: translateY(16px) scale(0.96);
      backdrop-filter: blur(12px);

    body.scene-three .music-card {
      animation: musicCardIn 800ms cubic-bezier(.2,.8,.18,1) 2500ms forwards;
    }

    .music-art {
      aspect-ratio: 1;
      border-radius: 999px;
      box-shadow: inset 0 0 0 3px rgba(255, 247, 239, 0.18);
    }

    .music-info {
      min-width: 0;
      color: rgba(255, 247, 239, 0.92);
      text-align: left;
    }

    .music-info h3 {
      margin: 0;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.04rem, 3.2vw, 1.35rem);
      font-weight: 400;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-info p {
      margin: 5px 0 12px;
      overflow: hidden;
      color: rgba(255, 247, 239, 0.62);
      font-size: 0.9rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spotify {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border: 1px solid rgba(255, 247, 239, 0.18);
      border-radius: 999px;
      background: rgba(255, 247, 239, 0.1);

      font-size: 0.86rem;
      text-decoration: none;
      transition: background 180ms ease, transform 180ms ease;
    }

    .spotify:hover {
      background: rgba(255, 247, 239, 0.17);
      transform: translateY(-2px);
    }

    .beat {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 999px;
      background: var(--c);
      opacity: 0;
      filter: blur(0.2px);
      animation: beatFloat var(--duration) ease-in-out var(--delay) infinite;
    }

    .music-photos {
      z-index: 4;
    }

    .music-photo {
      position: absolute;
      display: grid;
      width: clamp(82px, 15vw, 126px);
      aspect-ratio: 0.82;
      padding: 7px 7px 26px;
      border: 0;
      border-radius: 3px;
      background: rgba(255, 250, 245, 0.96);
      box-shadow: 0 20px 38px rgba(0,0,0,.26);
      color: rgba(70, 54, 60, 0.68);
      cursor: grab;
      font-size: 0.7rem;
      opacity: 0;
      pointer-events: auto;
      transform: translateY(18px) rotate(var(--rot));
      transition: opacity 700ms ease, transform 700ms ease;
      animation: photoFloat 4600ms ease-in-out var(--delay) infinite;
      touch-action: none;
    }

    .music-photo.is-visible {
      opacity: 1;
      transform: translateY(0) rotate(var(--rot));
    }

    .music-photo.is-dragging {
      z-index: 6;
      cursor: grabbing;
      transition: none;
      animation: none;
    }

    .ready-next {
      position: absolute;
      right: 50%;
      bottom: clamp(18px, 5vh, 44px);
      z-index: 5;
      display: grid;
      gap: 13px;
      justify-items: center;
      color: rgba(255, 247, 239, 0.78);
      font-size: clamp(0.92rem, 3vw, 1.02rem);
      text-align: center;
      opacity: 0;
      transform: translate(50%, 12px);

    body.scene-three .ready-next {
      animation: readyIn 700ms ease 3900ms forwards;
    }

    .lets-go {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid rgba(255, 247, 239, 0.18);
      border-radius: 999px;
      background: rgba(255, 247, 239, 0.12);

    .lets-go:hover {

    @media (max-width: 760px) {

    @keyframes sceneFade {
      to { opacity: 1; }

    @keyframes particleRise {
      0%, 14% {
        opacity: 0;

      }

      0% {

      }

    @keyframes sparklePop {

        opacity: 0;

        opacity: 0;
        transform: rotate(45deg) scale(0.25);
      }

    @keyframes petalFall {
      0% {
        opacity: 0;

      }

        opacity: 0.95;
      }

        opacity: 0;
        transform: translate3d(var(--drift), 104vh, 0) rotate(var(--spin));
      }
    }

    @keyframes buttonIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes starPulse {
      0%, 100% {
        opacity: calc(var(--opacity) * 0.42);

      }

        opacity: var(--opacity);
        transform: scale(1);
      }
    }

    @keyframes playerIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes needleDrop {
      to {
        transform: rotate(-8deg);
      }
    }

    @keyframes recordSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes musicCardIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes beatFloat {
      0%, 100% {
        opacity: 0;
        transform: translate3d(0, 18px, 0) scale(0.6);
      }
      44% {
        opacity: 0.86;
        transform: translate3d(var(--drift), -18px, 0) scale(1.1);
      }
    }

    @keyframes photoFloat {
      0%, 100% {
        margin-top: 0;
      }
      50% {
        margin-top: -12px;
      }
    }

    @keyframes readyIn {
      to {
        opacity: 1;
        transform: translate(50%, 0);
      }
    }

    @keyframes flameFlicker {
      from {
        transform: translateX(-50%) rotate(41deg) scale(0.92);
      }
      to {
        transform: translateX(-50%) rotate(49deg) scale(1.06);
      }
    }

    @keyframes smokeRise {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.7);
      }
      20% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + 12px), -34px) scale(1.8);
      }
    }

    @keyframes partyPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1) rotate(var(--r));
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(calc(var(--r) + 180deg));
      }
    }

    @keyframes heartClose {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.15) rotate(-45deg);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(-45deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(60) rotate(-45deg);
      }
    }

    @media (max-width: 520px) {
      .opening {
        min-height: 100svh;
        padding-top: 28px;
        padding-bottom: 28px;
      }

      .copy {
        min-height: 132px;
      }

      .subtitle {
        margin-top: 14px;
        line-height: 1.5;
      }

      .photo-stage {
        width: min(72vw, 278px);
      }

      .caption {
        font-size: 0.76rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-delay: 1ms !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
      }
    }
  
    .final-next-wrap {
      display: flex;
      justify-content: center;
      margin-top: clamp(28px, 6vh, 52px);
      position: relative;
      z-index: 3;
    }

    .final-next {
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(255,255,255,0.10);
      color: #fff7ef;
      border-radius: 999px;
      padding: 13px 24px;
      min-height: 46px;
      font: inherit;
      cursor: pointer;
      transition: transform 220ms ease, background 220ms ease;
    }

    .final-next:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }

    .love-room {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.02);
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 210, 220, 0.34), transparent 34%),
        linear-gradient(145deg, #fff5f5, #f8dce5 52%, #f2c8d8);
      transition: opacity 900ms ease, transform 900ms ease;
    }

    body.scene-five .music-room {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    body.scene-five .love-room {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .love-heart {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      color: #d94b70;
      font-family: Georgia, serif;
      font-size: min(100vw, 100vh);
      line-height: 1;
      transform: translate(-50%, -54%) scale(0.08);
      opacity: 0;
      filter: drop-shadow(0 18px 30px rgba(160, 55, 84, 0.20));
    }

    body.scene-five .love-heart {
      animation: heartGrow 2600ms cubic-bezier(.16,.84,.18,1) 150ms forwards;
    }

    .love-message {
      position: relative;
      z-index: 2;
      margin-top: min(48vh, 360px);
      color: #9f274d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 10vw, 7.5rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      opacity: 0;
      transform: translateY(18px) scale(0.82);
    }

    body.scene-five .love-message {
      animation: loveReveal 1200ms cubic-bezier(.2,.8,.2,1) 2050ms forwards;
    }

    @keyframes heartGrow {
      0% {
        opacity: 0;
        transform: translate(-50%, -54%) scale(0.08);
      }
      12% {
        opacity: 1;
      }
      68% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(2.9);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -54%) scale(9.5);
      }
    }

    @keyframes loveReveal {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.82);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .love-heart {
        opacity: 1;
        transform: translate(-50%, -54%) scale(9.5);
      }

      .love-message {
        opacity: 1;
        transform: none;
      }
    }

  
    /* FINAL LOVE PAGE FIX */
    body.scene-five .music-room {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.98) !important;
    }

    body.scene-five .love-room {
      opacity: 1 !important;
      pointer-events: auto !important;
      visibility: visible !important;
      transform: scale(1) !important;
    }

    .love-heart {
      z-index: 1;
      width: 100vw !important;
      height: 100vh !important;
      font-size: min(100vw, 100vh) !important;
    }

    body.scene-five .love-heart {
      animation: heartGrow 2600ms cubic-bezier(.16,.84,.18,1) 150ms forwards !important;
    }

    body.scene-five .love-message {
      z-index: 5;
      animation: loveReveal 1200ms cubic-bezier(.2,.8,.2,1) 2500ms forwards !important;
    }

  </style>

<body>
  <main class="scene" aria-label="Birthday opening scene">
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <section class="opening">
      <div class="copy" aria-live="polite">
        <h1 class="headline" id="headline"></h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="name" id="name"></p>
      </div>

      <div class="photo-stage" id="photoStage">
        <div class="hat" id="hat" aria-hidden="true">
          <div class="hat-pom"></div>
          <div class="hat-cone"></div>
          <div class="hat-brim"></div>
        </div>
        <div class="photo-frame">
          <div class="photo" id="photo">
            <img id="childPhoto" alt="Her childhood photo">
            <div class="photo-placeholder">Add her childhood photo here for the final version.</div>
          </div>
          <div class="caption" id="caption">the little girl who became everything</div>
        </div>
      </div>

      <button class="begin" type="button" id="begin">Begin my little surprise -></button>
    </section>

    <section class="letter-room" id="letterRoom" aria-label="Letter scene">
      <div class="room-glow" aria-hidden="true"></div>
      <h2 class="room-title">A little letter, just for you.</h2>

      <div class="polaroids" id="polaroids" aria-hidden="true"></div>

      <div class="envelope-area" id="envelopeArea">
        <p class="envelope-hint" id="envelopeHint">Click the envelope.</p>

        <button class="envelope" type="button" id="envelope" aria-label="Envelope. Click to bring it closer.">
          <span class="env-back"></span>
          <span class="env-flap"></span>
          <span class="env-front"></span>
          <span class="env-left"></span>
          <span class="env-right"></span>
          <span class="ribbon-line"></span>
          <span class="seal" id="seal" role="button" aria-label="Drag the wax seal sideways">&hearts;</span>
          <span class="env-address" aria-hidden="true">
            <span>To: <strong id="envName">My Love</strong></span>
            <span>From: Me &hearts;</span>
          </span>
        </button>

        <article class="letter-paper" id="letterPaper" aria-label="Birthday letter">
          <div class="letter-lines" id="letterLines"></div>
          <button class="more" type="button" id="moreButton">There's more -></button>
        </article>
      </div>
    </section>

    <section class="music-room" id="musicRoom" aria-label="Music scene">
      <div class="stars" id="stars" aria-hidden="true"></div>
      <div class="music-reaction" id="musicReaction" aria-hidden="true"></div>
      <div class="music-photos" id="musicPhotos" aria-hidden="true"></div>

      <div class="music-copy">
        <h2>There's a song that reminds me of you.</h2>
        <p>Every time I hear it, I think of you.</p>
      </div>

      <div class="music-stage">
        <div class="turntable-wrap" aria-hidden="true">
          <div class="turntable"></div>
          <div class="record">
            <div class="album-art"></div>
          </div>
          <div class="needle"></div>
        </div>

        <div class="music-card" aria-label="Song card">
          <div class="music-art"></div>
          <div class="music-info">
            <h3 id="songTitle">The song title goes here</h3>
            <p id="songArtist">Artist name</p>
            <a class="spotify" id="spotifyLink" href="#" aria-label="Open song on Spotify">Open on Spotify</a>
          </div>
        </div>
      </div>

      <div class="final-next-wrap">
        <button class="final-next" type="button" id="finalNext">Next <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section class="love-room" id="loveRoom" aria-label="Final love message">
      <div class="love-heart" id="loveHeart" aria-hidden="true">♥</div>
      <div class="love-message" id="loveMessage">I LOVE YOU</div>
    </section>
  </main>

  <script>
    const config = {
      herName: "My Love",
      childhoodPhoto: "",
      caption: "the little girl who became everything",
      headline: "Happy Birthday",
      subtitle: "to the little girl who grew into the person I love.",
      letter: [
        "My love,",
        "I wanted to make something different for you this year.",
        "Something quiet, a little dreamy, and made only for you.",
        "Something you could open slowly, like a memory.",
        "I hope you like what I made for you."
      ],
      polaroids: [
        { caption: "Look at you", x: 9, y: 52, rot: "-8deg", a: "#f4b6c3", b: "#f9e4d9" },
        { caption: "The cutest little girl", x: 72, y: 50, rot: "7deg", a: "#d9c7e8", b: "#fff0dc" },
        { caption: "Tiny wonder", x: 14, y: 20, rot: "6deg", a: "#ffd8d4", b: "#e8c9df" },
        { caption: "Always her", x: 75, y: 22, rot: "-6deg", a: "#f5c7ae", b: "#f8d9dd" }
      ],
      music: {
        title: "The song title goes here",
        artist: "Artist name",
        spotifyUrl: "#"
      },
      musicPhotos: [
        { caption: "This one belongs near the song", x: 8, y: 28, rot: "-7deg", a: "#f1a8b6", b: "#d5b5e4", delay: "0ms" },
        { caption: "A little memory", x: 77, y: 29, rot: "6deg", a: "#e9c7a7", b: "#f8d9dd", delay: "520ms" },
        { caption: "Favorite smile", x: 12, y: 66, rot: "5deg", a: "#cdb7e6", b: "#ffe5d6", delay: "980ms" },
        { caption: "My whole heart", x: 76, y: 66, rot: "-6deg", a: "#f3b4bd", b: "#f0d0aa", delay: "1320ms" }
      ]
    };

    const headline = document.getElementById("headline");
    const subtitle = document.getElementById("subtitle");
    const nameTarget = document.getElementById("name");
    const caption = document.getElementById("caption");
    const photo = document.getElementById("photo");
    const childPhoto = document.getElementById("childPhoto");
    const particles = document.getElementById("particles");
    const confetti = document.getElementById("confetti");
    const begin = document.getElementById("begin");
    const photoStage = document.getElementById("photoStage");
    const envelopeArea = document.getElementById("envelopeArea");
    const envelope = document.getElementById("envelope");
    const envelopeHint = document.getElementById("envelopeHint");
    const envName = document.getElementById("envName");
    const seal = document.getElementById("seal");
    const letterPaper = document.getElementById("letterPaper");
    const letterLines = document.getElementById("letterLines");
    const polaroids = document.getElementById("polaroids");
    const moreButton = document.getElementById("moreButton");
    const stars = document.getElementById("stars");
    const musicReaction = document.getElementById("musicReaction");
    const musicPhotos = document.getElementById("musicPhotos");
    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const spotifyLink = document.getElementById("spotifyLink");

    const params = new URLSearchParams(window.location.search);
    const nameFromUrl = params.get("name");
    const photoFromUrl = params.get("photo");
    const herName = nameFromUrl && nameFromUrl.trim() ? nameFromUrl.trim() : config.herName;
    const photoSource = photoFromUrl && photoFromUrl.trim() ? photoFromUrl.trim() : config.childhoodPhoto;

    caption.textContent = config.caption;
    envName.textContent = herName;
    songTitle.textContent = config.music.title;
    songArtist.textContent = config.music.artist;
    spotifyLink.href = config.music.spotifyUrl;

    if (photoSource) {
      childPhoto.src = photoSource;
      photo.classList.add("has-image");
    }

    function writeCharacters(target, text, startDelay, step, className) {
      target.textContent = "";
      Array.from(text).forEach((char, index) => {
        const span = document.createElement("span");
        span.className = className;
        span.style.setProperty("--delay", `${startDelay + index * step}ms`);
        span.innerHTML = char === " " ? "&nbsp;" : char;
        target.appendChild(span);
      });
    }

    function writeWords(target, text, startDelay, step) {
      target.textContent = "";
      text.split(" ").forEach((word, index) => {
        const span = document.createElement("span");
        span.className = "word";
        span.style.setProperty("--delay", `${startDelay + index * step}ms`);
        span.textContent = word;
        target.appendChild(span);
      });
    }

    function createParticles() {
      const count = window.matchMedia("(max-width: 520px)").matches ? 30 : 46;
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const dot = document.createElement("span");
        const size = 2 + Math.random() * 4.5;
        dot.className = "particle";
        dot.style.setProperty("--x", `${Math.random() * 100}%`);
        dot.style.setProperty("--y", `${15 + Math.random() * 78}%`);
        dot.style.setProperty("--size", `${size}px`);
        dot.style.setProperty("--duration", `${5200 + Math.random() * 4200}ms`);
        dot.style.setProperty("--delay", `${650 + Math.random() * 5200}ms`);
        dot.style.setProperty("--drift", `${-20 + Math.random() * 40}px`);
        dot.style.setProperty("--opacity", `${0.28 + Math.random() * 0.58}`);
        fragment.appendChild(dot);
      }

      particles.appendChild(fragment);
    }

    function createSparkles() {
      const points = [
        { x: "31%", y: "14%", delay: 6900 },
        { x: "68%", y: "17%", delay: 7040 },
        { x: "38%", y: "30%", delay: 7160 },
        { x: "61%", y: "28%", delay: 7300 }
      ];

      points.forEach((point) => {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.left = point.x;
        sparkle.style.top = point.y;
        sparkle.style.setProperty("--delay", `${point.delay}ms`);
        photoStage.appendChild(sparkle);
      });
    }

    function createPetals() {
      const colors = ["#f0a9b6", "#fff2e7", "#d9c7e8", "#f8cbd3"];
      const count = window.matchMedia("(max-width: 520px)").matches ? 18 : 28;
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.setProperty("--x", `${Math.random() * 100}%`);
        petal.style.setProperty("--w", `${6 + Math.random() * 8}px`);
        petal.style.setProperty("--h", `${8 + Math.random() * 11}px`);
        petal.style.setProperty("--c", colors[index % colors.length]);
        petal.style.setProperty("--duration", `${4300 + Math.random() * 2800}ms`);
        petal.style.setProperty("--delay", `${6900 + Math.random() * 1400}ms`);
        petal.style.setProperty("--drift", `${-90 + Math.random() * 180}px`);
        petal.style.setProperty("--spin", `${160 + Math.random() * 420}deg`);
        fragment.appendChild(petal);
      }

      confetti.appendChild(fragment);
    }

    function beginSceneTwo() {
      document.body.classList.add("scene-two");
      envelopeHint.textContent = "Click the envelope.";
    }

    function prepareLetter() {
      letterLines.textContent = "";
      config.letter.forEach((line) => {
        const paragraph = document.createElement("p");
        paragraph.className = "letter-line";
        paragraph.textContent = line;
        letterLines.appendChild(paragraph);
      });
    }

    function revealLetterLines() {
      const lines = Array.from(document.querySelectorAll(".letter-line"));
      lines.forEach((line, index) => {
        window.setTimeout(() => line.classList.add("is-visible"), 900 + index * 1100);
      });

      window.setTimeout(() => {
        moreButton.classList.add("is-visible");
        revealPolaroids();
      }, 1200 + lines.length * 1100);
    }

    function revealPolaroids() {
      Array.from(polaroids.children).forEach((polaroid, index) => {
        window.setTimeout(() => polaroid.classList.add("is-visible"), index * 260);
      });
    }

    function createPolaroids() {
      const fragment = document.createDocumentFragment();

      config.polaroids.forEach((item, index) => {
        const polaroid = document.createElement("button");
        const picture = document.createElement("span");
        const cap = document.createElement("span");

        polaroid.type = "button";
        polaroid.className = "polaroid";
        polaroid.setAttribute("aria-label", `Draggable photo: ${item.caption}`);
        polaroid.style.left = `${item.x}%`;
        polaroid.style.top = `${item.y}%`;
        polaroid.style.setProperty("--rot", item.rot);
        polaroid.style.setProperty("--a", item.a);
        polaroid.style.setProperty("--b", item.b);
        picture.className = "polaroid-picture";
        picture.textContent = index + 1;
        cap.className = "polaroid-caption";
        cap.textContent = item.caption;

        polaroid.append(picture, cap);
        makeDraggable(polaroid);
        fragment.appendChild(polaroid);
      });

      polaroids.appendChild(fragment);
    }

    function createStars() {
      const count = window.matchMedia("(max-width: 520px)").matches ? 54 : 82;
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.setProperty("--x", `${Math.random() * 100}%`);
        star.style.setProperty("--y", `${Math.random() * 86}%`);
        star.style.setProperty("--size", `${1.5 + Math.random() * 3.5}px`);
        star.style.setProperty("--opacity", `${0.24 + Math.random() * 0.68}`);
        star.style.setProperty("--duration", `${2200 + Math.random() * 3200}ms`);
        star.style.setProperty("--delay", `${Math.random() * 2600}ms`);
        fragment.appendChild(star);
      }

      stars.appendChild(fragment);
    }

    function createMusicReaction() {
      const colors = ["rgba(248,217,221,.72)", "rgba(217,199,232,.64)", "rgba(255,247,239,.58)", "rgba(233,199,167,.62)"];
      const count = window.matchMedia("(max-width: 520px)").matches ? 22 : 34;
      const fragment = document.createDocumentFragment();

      for (let index = 0; index < count; index += 1) {
        const beat = document.createElement("span");
        beat.className = "beat";
        beat.style.setProperty("--x", `${18 + Math.random() * 64}%`);
        beat.style.setProperty("--y", `${24 + Math.random() * 54}%`);
        beat.style.setProperty("--size", `${3 + Math.random() * 8}px`);
        beat.style.setProperty("--duration", `${1800 + Math.random() * 1600}ms`);
        beat.style.setProperty("--delay", `${1900 + Math.random() * 2200}ms`);
        beat.style.setProperty("--drift", `${-34 + Math.random() * 68}px`);
        beat.style.setProperty("--c", colors[index % colors.length]);
        fragment.appendChild(beat);
      }

      musicReaction.appendChild(fragment);
    }

    function createMusicPhotos() {
      const fragment = document.createDocumentFragment();

      config.musicPhotos.forEach((item, index) => {
        const photoButton = document.createElement("button");
        const picture = document.createElement("span");
        const cap = document.createElement("span");

        photoButton.type = "button";
        photoButton.className = "music-photo";
        photoButton.setAttribute("aria-label", `Draggable music photo: ${item.caption}`);
        photoButton.style.left = `${item.x}%`;
        photoButton.style.top = `${item.y}%`;
        photoButton.style.setProperty("--rot", item.rot);
        photoButton.style.setProperty("--a", item.a);
        photoButton.style.setProperty("--b", item.b);
        photoButton.style.setProperty("--delay", item.delay);
        picture.className = "polaroid-picture";
        picture.textContent = index + 1;
        cap.className = "polaroid-caption";
        cap.textContent = item.caption;

        photoButton.append(picture, cap);
        makeDraggable(photoButton);
        fragment.appendChild(photoButton);
      });

      musicPhotos.appendChild(fragment);
    }

    function revealMusicPhotos() {
      Array.from(musicPhotos.children).forEach((photoButton, index) => {
        window.setTimeout(() => photoButton.classList.add("is-visible"), 2200 + index * 280);
      });
    }
    function makeDraggable(element) {
      let activePointer = null;
      let startX = 0;
      let startY = 0;
      let originalLeft = 0;
      let originalTop = 0;

      element.addEventListener("pointerdown", (event) => {
        activePointer = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        originalLeft = element.offsetLeft;
        originalTop = element.offsetTop;
        element.classList.add("is-dragging");
        element.setPointerCapture(activePointer);
      });

      element.addEventListener("pointermove", (event) => {
        if (event.pointerId !== activePointer) return;
        const nextLeft = originalLeft + event.clientX - startX;
        const nextTop = originalTop + event.clientY - startY;
        const maxLeft = window.innerWidth - element.offsetWidth;
        const maxTop = window.innerHeight - element.offsetHeight;
        element.style.left = `${Math.max(8, Math.min(maxLeft - 8, nextLeft))}px`;
        element.style.top = `${Math.max(8, Math.min(maxTop - 8, nextTop))}px`;
      });

      element.addEventListener("pointerup", (event) => {
        if (event.pointerId !== activePointer) return;
        element.classList.remove("is-dragging");
        activePointer = null;
      });
    }

    function breakSeal() {
      if (envelope.classList.contains("is-open")) return;
      envelope.classList.add("is-open");
      envelopeArea.classList.add("has-open-letter");
      envelope.setAttribute("aria-label", "The envelope is open.");
      envelopeHint.textContent = "The letter is opening...";
      window.setTimeout(() => {
        letterPaper.classList.add("is-visible");
        revealLetterLines();
      }, 640);
    }

    function setupSealDrag() {
      let pointerId = null;
      let startX = 0;
      let currentX = 0;
      const threshold = 118;

      seal.addEventListener("pointerdown", (event) => {
        if (!envelopeArea.classList.contains("is-close")) return;
        event.stopPropagation();
        pointerId = event.pointerId;
        startX = event.clientX;
        currentX = 0;
        seal.setPointerCapture(pointerId);
      });

      seal.addEventListener("pointermove", (event) => {
        if (event.pointerId !== pointerId) return;
        currentX = Math.max(-16, Math.min(150, event.clientX - startX));
        seal.style.transform = `translate(calc(-50% + ${currentX}px), -50%)`;
        if (currentX >= threshold) {
          pointerId = null;
          breakSeal();
        }
      });

      seal.addEventListener("pointerup", (event) => {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        if (currentX >= threshold) {
          breakSeal();
        } else {
          seal.style.transform = "translate(-50%, -50%)";
        }
      });
    }

    begin.addEventListener("click", beginSceneTwo);

    envelope.addEventListener("click", () => {
      if (envelope.classList.contains("is-open")) return;
      if (!envelopeArea.classList.contains("is-close")) {
        envelopeArea.classList.add("is-close");
        envelope.setAttribute("aria-label", "Envelope close up. Drag the seal sideways.");
        envelopeHint.textContent = "Drag the wax seal to the right.";
      }
    });

    moreButton.addEventListener("click", () => {
      document.body.classList.add("scene-three");
      revealMusicPhotos();
    });


    const finalNext = document.getElementById("finalNext");

    finalNext.addEventListener("click", () => {
      document.body.classList.remove("scene-five");
      void document.body.offsetWidth;
      document.body.classList.add("scene-five");
      const loveRoom = document.getElementById("loveRoom");
      if (loveRoom) loveRoom.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    writeCharacters(headline, config.headline, 3150, 62, "char");
    writeWords(subtitle, config.subtitle, 4150, 115);
    writeCharacters(nameTarget, herName, 5450, 86, "char");
    createParticles();
    createSparkles();
    createPetals();
    prepareLetter();
    createPolaroids();
    createStars();
    createMusicReaction();
    createMusicPhotos();
    setupSealDrag();
  </script>
</body>
</html>
